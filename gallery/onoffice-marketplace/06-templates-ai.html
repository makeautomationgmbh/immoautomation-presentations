<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, height=450">
  <title>immoautomation - Templates & AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 800px;
      height: 450px;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      overflow: hidden;
      position: relative;
    }
    .container {
      width: 800px;
      height: 450px;
      padding: 28px 32px;
      display: flex;
      gap: 40px;
      position: relative;
    }
    .left {
      width: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .templates-preview {
      position: relative;
      width: 280px;
      height: 320px;
    }
    .template-card {
      position: absolute;
      width: 180px;
      height: 220px;
      background: linear-gradient(145deg, #f8f9fa, #e9ecef);
      border: 1px solid rgba(0,0,0,0.1);
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .template-card:nth-child(1) {
      top: 0;
      left: 0;
      transform: rotate(-6deg);
      z-index: 1;
    }
    .template-card:nth-child(2) {
      top: 30px;
      left: 50px;
      transform: rotate(3deg);
      z-index: 2;
    }
    .template-card:nth-child(3) {
      top: 60px;
      left: 100px;
      transform: rotate(-2deg);
      z-index: 3;
    }
    .template-header {
      height: 60%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .template-header svg {
      width: 40px;
      height: 40px;
      color: white;
      opacity: 0.8;
    }
    .template-body {
      padding: 12px;
      flex: 1;
      background: white;
    }
    .template-line {
      height: 8px;
      background: rgba(0,0,0,0.1);
      margin-bottom: 8px;
      border-radius: 4px;
    }
    .template-line:last-child {
      width: 60%;
    }
    .right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .subtitle {
      color: rgba(0,0,0,0.4);
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h2 {
      font-size: 38px;
      line-height: 1.1;
      margin-bottom: 20px;
    }
    .headline-italic {
      font-family: 'Newsreader', serif;
      font-style: italic;
      font-weight: 400;
      color: #000;
    }
    .headline-bold {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      color: #0080FF;
      display: block;
      margin-top: 4px;
    }
    .features {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .feature-block {
      display: flex;
      gap: 16px;
    }
    .feature-icon {
      width: 48px;
      height: 48px;
      background: rgba(0,128,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .feature-icon svg {
      width: 24px;
      height: 24px;
      color: #0080FF;
    }
    .feature-content {
      flex: 1;
    }
    .feature-title {
      font-size: 15px;
      font-weight: 600;
      color: #000;
      margin-bottom: 4px;
    }
    .feature-desc {
      font-size: 12px;
      color: rgba(0,0,0,0.6);
      line-height: 1.5;
    }
    .ai-badge {
      position: absolute;
      bottom: 50px;
      left: 60px;
      background: #0080FF;
      color: white;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ai-badge svg {
      width: 16px;
      height: 16px;
    }
  </style>
</head>
<body>
  <svg style="position:absolute;inset:0;width:800px;height:450px;opacity:0.03" xmlns="http://www.w3.org/2000/svg">
    <defs><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M 60 0 L 0 0 0 60" fill="none" stroke="#000" stroke-width="1"/></pattern></defs>
    <rect width="800" height="450" fill="url(#grid)"/>
  </svg>
  <div class="container">
    <div class="left">
      <div class="templates-preview">
        <div class="template-card">
          <div class="template-header" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </div>
          <div class="template-body">
            <div class="template-line"></div>
            <div class="template-line"></div>
            <div class="template-line"></div>
          </div>
        </div>
        <div class="template-card">
          <div class="template-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </div>
          <div class="template-body">
            <div class="template-line"></div>
            <div class="template-line"></div>
            <div class="template-line"></div>
          </div>
        </div>
        <div class="template-card">
          <div class="template-header" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </div>
          <div class="template-body">
            <div class="template-line"></div>
            <div class="template-line"></div>
            <div class="template-line"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="right">
      <p class="subtitle">Templates & KI</p>
      <h2>
        <span class="headline-italic">Professionelle Designs</span>
        <span class="headline-bold">& KI-Texte</span>
      </h2>
      <div class="features">
        <div class="feature-block">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="13.5" cy="6.5" r="2.5"></circle>
              <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.555C21.965 6.012 17.461 2 12 2z"></path>
            </svg>
          </div>
          <div class="feature-content">
            <div class="feature-title">Designer-Templates</div>
            <div class="feature-desc">Große Auswahl an professionellen Templates - immer aktuell und anpassbar.</div>
          </div>
        </div>
        <div class="feature-block">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 4V2"></path>
              <path d="M15 16v-2"></path>
              <path d="M8 9h2"></path>
              <path d="M20 9h2"></path>
              <path d="M17.8 11.8L19 13"></path>
              <path d="M15 9h0"></path>
              <path d="M17.8 6.2L19 5"></path>
              <path d="M3 21l9-9"></path>
              <path d="M12.2 6.2L11 5"></path>
            </svg>
          </div>
          <div class="feature-content">
            <div class="feature-title">KI-generierte Captions</div>
            <div class="feature-desc">Automatisch erstellte, ansprechende Texte fur jeden Post.</div>
          </div>
        </div>
        <div class="feature-block">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </div>
          <div class="feature-content">
            <div class="feature-title">Live-Vorschau</div>
            <div class="feature-desc">Sehen Sie sofort, wie Ihr Post aussehen wird.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="ai-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
    </svg>
    KI-powered
  </div>
</body>
</html>
