<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, height=450">
  <title>immoautomation - Integrations</title>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 800px;
      height: 450px;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      overflow: hidden;
      position: relative;
    }
    .container {
      width: 800px;
      height: 450px;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .header {
      margin-bottom: 30px;
    }
    .subtitle {
      color: rgba(0,0,0,0.4);
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h2 {
      font-size: 36px;
      line-height: 1.1;
    }
    .headline-italic {
      font-family: 'Newsreader', serif;
      font-style: italic;
      font-weight: 400;
      color: #000;
    }
    .headline-bold {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      color: #0080FF;
      display: block;
      margin-top: 4px;
    }
    .workflow {
      flex: 1;
      background: rgba(0,128,255,0.1);
      border: 1px solid rgba(0,128,255,0.3);
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }
    .workflow-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .workflow-icon {
      width: 64px;
      height: 64px;
      background: white;
      border: 1px solid rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .workflow-icon.main {
      width: 80px;
      height: 80px;
      background: #0080FF;
      border: none;
      position: relative;
    }
    .workflow-icon.main::after {
      display: none;
    }
    .workflow-icon svg {
      width: 28px;
      height: 28px;
      color: rgba(0,0,0,0.7);
    }
    .workflow-icon.main svg {
      width: 36px;
      height: 36px;
      color: white;
    }
    .workflow-label {
      text-align: center;
    }
    .workflow-name {
      font-size: 13px;
      font-weight: 600;
      color: #000;
    }
    .workflow-desc {
      font-size: 10px;
      color: rgba(0,0,0,0.5);
    }
    .arrow {
      display: flex;
      align-items: center;
    }
    .arrow-line {
      width: 40px;
      height: 1px;
      background: rgba(0,128,255,0.3);
    }
    .arrow svg {
      width: 16px;
      height: 16px;
      color: rgba(0,128,255,0.5);
      margin-left: -4px;
    }
    .social-icons {
      display: flex;
      gap: 10px;
    }
    .social-icon {
      width: 48px;
      height: 48px;
      background: white;
      border: 1px solid rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .social-icon svg {
      width: 22px;
      height: 22px;
      color: rgba(0,0,0,0.7);
    }
    .footer {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding-top: 20px;
      margin-top: 20px;
    }
    .footer-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: rgba(0,0,0,0.5);
    }
    .footer-dot {
      width: 6px;
      height: 6px;
      background: #0080FF;
    }
  </style>
</head>
<body>
