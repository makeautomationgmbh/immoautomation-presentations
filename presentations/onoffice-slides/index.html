<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, initial-scale=1.0" />
  <title>immoautomation — onOffice Präsentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue: #0080FF;
      --blue-hover: #0066CC;
      --blue-light: rgba(0, 128, 255, 0.1);
      --blue-glow: rgba(0, 128, 255, 0.2);
      --black: #1a1a2e;
      --white: #fcfcff;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--white);
      color: var(--black);
    }

    .font-newsreader {
      font-family: 'Newsreader', Georgia, serif;
    }

    /* ---- Slide Container ---- */
    .slides-wrapper {
      width: 1920px;
      height: 1080px;
      position: relative;
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 72px 100px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .slide.active {
      display: flex;
      opacity: 1;
    }

    /* ---- Navigation ---- */
    .slide-nav {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 100;
    }

    .slide-nav button {
      width: 8px;
      height: 8px;
      background: rgba(0, 0, 0, 0.15);
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .slide-nav button.active {
      background: var(--blue);
      width: 32px;
    }

    .slide-counter {
      position: fixed;
      bottom: 32px;
      right: 48px;
      font-size: 12px;
      color: rgba(0, 0, 0, 0.3);
      font-variant-numeric: tabular-nums;
      z-index: 100;
    }

    /* ---- Keyboard hint ---- */
    .key-hint {
      position: fixed;
      bottom: 32px;
      left: 48px;
      font-size: 11px;
      color: rgba(0, 0, 0, 0.25);
      z-index: 100;
    }

    .key-hint kbd {
      display: inline-block;
      padding: 2px 6px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      font-family: 'Inter', monospace;
      font-size: 10px;
    }

    /* ---- Animations ---- */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .animate-up {
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .animate-fade {
      animation: fadeIn 0.6s ease-out both;
    }

    .animate-scale {
      animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.35s; }
    .delay-4 { animation-delay: 0.5s; }
    .delay-5 { animation-delay: 0.65s; }
    .delay-6 { animation-delay: 0.8s; }

    /* ---- SLIDE 1: About Us ---- */
    .slide-about {
      background: var(--white);
      position: relative;
      overflow: hidden;
    }

    .slide-about .grid-bg {
      position: absolute;
      inset: 0;
      opacity: 0.03;
      background-image:
        linear-gradient(#000 1px, transparent 1px),
        linear-gradient(90deg, #000 1px, transparent 1px);
      background-size: 100px 100px;
    }

    .slide-about .content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1720px;
      display: flex;
      flex-direction: column;
      gap: 64px;
    }

    /* Top section: logo + tagline */
    .about-header {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .about-header .label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: rgba(0, 0, 0, 0.35);
    }

    .about-header .logo-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .about-header .logo-row img {
      height: 48px;
      width: auto;
    }

    .about-header .divider {
      width: 1px;
      height: 36px;
      background: rgba(0, 0, 0, 0.1);
    }

    .about-header .tagline {
      font-size: 20px;
      color: rgba(0, 0, 0, 0.5);
      font-weight: 400;
    }

    .about-title {
      font-size: 76px;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .about-title .serif {
      font-family: 'Newsreader', serif;
      font-style: italic;
      font-weight: 400;
      color: var(--black);
    }

    .about-title .blue {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      color: var(--blue);
    }

    .about-title .light {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 48px;
      color: rgba(0, 0, 0, 0.35);
    }

    /* Team grid */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }

    .team-card {
      padding: 32px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
      border-right: 1px solid rgba(0, 0, 0, 0.08);
    }

    .team-card:last-child {
      border-right: none;
    }

    .team-card.presenter::after {
      content: 'Pr\00e4sentiert';
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--blue);
      background: var(--blue-light);
      padding: 4px 10px;
    }

    .team-card .avatar {
      width: 80px;
      height: 80px;
      object-fit: cover;
      filter: grayscale(15%);
      flex-shrink: 0;
      border-radius: 50%;
    }

    .team-card .info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .team-card .name {
      font-size: 24px;
      font-weight: 600;
      color: var(--black);
    }

    .team-card .role {
      font-size: 17px;
      color: rgba(0, 0, 0, 0.45);
      font-weight: 400;
    }

    /* ---- Fullscreen button ---- */
    .fullscreen-btn {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 200;
      background: white;
      border: 1px solid rgba(0,0,0,0.1);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .fullscreen-btn:hover {
      border-color: var(--blue);
      background: var(--blue-light);
    }

    .fullscreen-btn svg {
      width: 16px;
      height: 16px;
      color: rgba(0,0,0,0.5);
    }

    .fullscreen-btn:hover svg {
      color: var(--blue);
    }
  </style>
</head>
<body>

  <!-- Fullscreen toggle -->
  <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Vollbild (F)">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
    </svg>
  </button>

  <div class="slides-wrapper">

    <!-- ==================== SLIDE 1: ABOUT US ==================== -->
    <div class="slide slide-about active" id="slide-1">
      <div class="grid-bg"></div>

      <div class="content">
        <!-- Header -->
        <div class="about-header animate-up delay-1">
          <p class="label">Über uns</p>

          <div class="logo-row">
            <img src="https://app.immoautomation.at/assets/logo-EsjYfG1v.png" alt="immoautomation" />
            <div class="divider"></div>
            <span class="tagline">Eine Social Media Marketing Suite für Immobilienmakler</span>
          </div>
        </div>

        <!-- Main title -->
        <div class="about-title animate-up delay-2">
          <span class="serif">Wir automatisieren</span><br />
          <span class="blue">Social Media</span><br />
          <span class="light">für die Immobilienbranche.</span>
        </div>

        <!-- Team Grid -->
        <div class="team-grid animate-up delay-3">
          <!-- Rafael -->
          <div class="team-card presenter">
            <img
              class="avatar"
              src="https://media.licdn.com/dms/image/v2/D4D03AQGeDA5sQDp25Q/profile-displayphoto-scale_400_400/B4DZjRF_SLH4Ak-/0/1755854667560?e=1773273600&v=beta&t=AVuiWBEInNlNUUcEmoaIV7p_zoo73rBbqSS3T0CuCUY"
              alt="Rafael Kietaibl"
            />
            <div class="info">
              <div class="name">Rafael Kietaibl</div>
              <div class="role">Co-Founder</div>
            </div>
          </div>

          <!-- Niklas -->
          <div class="team-card">
            <img
              class="avatar"
              src="https://media.licdn.com/dms/image/v2/D4D03AQEh9AuIHyASNA/profile-displayphoto-scale_400_400/B4DZjL4qOqH4Ag-/0/1755767287553?e=1773273600&v=beta&t=dH79w2shvGuhs_gahYcXm2u83FHQLc07yg_fRVEcdxM"
              alt="Niklas Kietaibl"
            />
            <div class="info">
              <div class="name">Niklas Kietaibl</div>
              <div class="role">Co-Founder</div>
            </div>
          </div>

          <!-- Alexander -->
          <div class="team-card">
            <img
              class="avatar"
              src="https://media.licdn.com/dms/image/v2/D4E03AQGiCOMmmEvH4A/profile-displayphoto-scale_400_400/B4EZf6ygysH4Ak-/0/1752259238543?e=1773273600&v=beta&t=sW1ynnsTMnyfRyack092bwIC5W6cZhEwF36wRE8qw3I"
              alt="Alexander Gottlieb"
            />
            <div class="info">
              <div class="name">Alexander Gottlieb</div>
              <div class="role">CTO</div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Navigation -->
  <div class="slide-nav" id="slideNav"></div>
  <div class="slide-counter" id="slideCounter"></div>
  <div class="key-hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> oder Klick zum Navigieren &nbsp;&middot;&nbsp; <kbd>F</kbd> Vollbild</div>

  <script>
    // ---- Slide Engine ----
    var slides = document.querySelectorAll('.slide');
    var current = 0;

    function showSlide(index) {
      for (var i = 0; i < slides.length; i++) {
        slides[i].classList.remove('active');
        if (i === index) {
          var animated = slides[i].querySelectorAll('[class*="animate-"]');
          for (var j = 0; j < animated.length; j++) {
            animated[j].style.animation = 'none';
            animated[j].offsetHeight;
            animated[j].style.animation = '';
          }
        }
      }
      slides[index].classList.add('active');
      current = index;
      updateNav();
    }

    function nextSlide() {
      if (current < slides.length - 1) showSlide(current + 1);
    }

    function prevSlide() {
      if (current > 0) showSlide(current - 1);
    }

    function updateNav() {
      var nav = document.getElementById('slideNav');
      nav.innerHTML = '';
      for (var i = 0; i < slides.length; i++) {
        var btn = document.createElement('button');
        if (i === current) btn.classList.add('active');
        btn.setAttribute('data-index', i);
        btn.addEventListener('click', function() {
          showSlide(parseInt(this.getAttribute('data-index')));
        });
        nav.appendChild(btn);
      }
      document.getElementById('slideCounter').textContent =
        (current + 1) + ' / ' + slides.length;
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    });

    document.addEventListener('click', function(e) {
      if (e.target.closest('.slide-nav') || e.target.closest('.fullscreen-btn') || e.target.closest('button')) return;
      if (e.clientX > window.innerWidth / 2) nextSlide();
      else prevSlide();
    });

    updateNav();
  </script>
</body>
</html>
