<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide 03 — Umfrage: Social Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --blue: #0080FF;
      --blue-light: rgba(0, 128, 255, 0.1);
      --blue-glow: rgba(0, 128, 255, 0.2);
      --black: #1a1a2e;
      --white: #fcfcff;
      --text-secondary: rgba(0, 0, 0, 0.5);
      --text-muted: rgba(0, 0, 0, 0.35);
      --border: rgba(0, 0, 0, 0.08);
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--white);
      color: var(--black);
    }
    .scale-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #1a1a2e;
    }
    .slide {
      flex-shrink: 0;
      transform-origin: center center;
      width: 1920px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 72px 100px;
      position: relative;
      overflow: hidden;
    }
    .grid-bg { position: absolute; inset: 0; pointer-events: none; }
    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1720px;
      display: flex;
      flex-direction: column;
    }
    .section-label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--text-muted);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-up { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .animate-fade { animation: fadeIn 0.6s ease-out both; }
    .animate-scale { animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.35s; }
    .delay-4 { animation-delay: 0.5s; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
    <defs>
      <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#000" stroke-width="1" opacity="0.03"/>
      </pattern>
    </defs>
  </svg>

  <div class="scale-container" id="scaleContainer">
    <div class="slide" id="slide-3">
    <svg class="grid-bg" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080">
      <rect width="1920" height="1080" fill="url(#grid)"/>
    </svg>
    <div class="content" style="gap: 56px;align-items:center;justify-content:center;text-align:center;">

      <div class="animate-up delay-1">
        <p class="section-label">Kurze Umfrage</p>
      </div>

      <!-- Hand/Question Icon -->
      <div class="animate-scale delay-2" style="width:120px;height:120px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;">
        <svg width="56" height="56" fill="none" stroke="var(--blue)" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z" /></svg>
      </div>

      <!-- Main Question -->
      <div style="font-size:72px;line-height:1.1;letter-spacing:-0.025em;max-width:1200px;" class="animate-up delay-3">
        <span style="font-family:'Newsreader',serif;font-style:italic;font-weight:400;">Wer von euch</span><br/>
        <span style="font-weight:700;color:var(--blue);">macht aktiv Social Media?</span>
      </div>

      <!-- Sub-question -->
      <div style="font-size:28px;color:var(--text-secondary);font-weight:300;max-width:900px;line-height:1.5;" class="animate-up delay-4">
        Wer postet regelmäßig und ist aktiv auf Social Media unterwegs?
      </div>

    </div>
  </div>
  </div>

  <script>
    function scalePresentation() {
      var slide = document.querySelector('.slide');
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var scaleX = vw / 1920;
      var scaleY = vh / 1080;
      var scale = Math.min(scaleX, scaleY);
      slide.style.transform = 'scale(' + scale + ')';
    }
    window.addEventListener('resize', scalePresentation);
    scalePresentation();
  </script>
</body>
</html>
